minimum_pre_commit_version: "4.6.2"
repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: Reject private files and recognizable credentials in the Git index
        entry: uv run --project api --locked python api/scripts/check_repository.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --project api --locked ruff check api
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: uv run --project api --locked ruff format --check api
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Strict Python types
        entry: uv run --directory api --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Offline API tests
        entry: uv run --directory api --locked pytest --cov=met_agent --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
