services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      DATA_DIR: /app/data
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped

  web:
    build:
      context: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  qdrant-data:
  api-data:
