name: Deploy web Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.ENABLE_WEB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Enforce verified CI deployment gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Enforcing CI quality gate for commit $TARGET_SHA"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Deployment blocked: CI conclusion was ${{ github.event.workflow_run.conclusion }}"
              exit 1
            fi
          fi
          CHECK_RUNS=$(curl -sSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$TARGET_SHA/check-runs")
          PYTHON_OK=$(echo "$CHECK_RUNS" | grep -A 10 '"name": "Python 3.12 quality checks"' | grep '"conclusion": "success"' || true)
          WEB_OK=$(echo "$CHECK_RUNS" | grep -A 10 '"name": "Node 20 web and Workers checks"' | grep '"conclusion": "success"' || true)
          CONTAINER_OK=$(echo "$CHECK_RUNS" | grep -A 10 '"name": "Production container builds"' | grep '"conclusion": "success"' || true)
          if [ -z "$PYTHON_OK" ] || [ -z "$WEB_OK" ] || [ -z "$CONTAINER_OK" ]; then
            echo "Deployment blocked: All required CI checks must pass before deployment."
            echo "Python check status: $(echo "$CHECK_RUNS" | grep -A 10 '"name": "Python 3.12 quality checks"' | grep '"conclusion"' || echo 'not found')"
            echo "Web check status: $(echo "$CHECK_RUNS" | grep -A 10 '"name": "Node 20 web and Workers checks"' | grep '"conclusion"' || echo 'not found')"
            exit 1
          fi
          echo "Verified: Required CI checks passed with success for $TARGET_SHA."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Require production deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || { echo 'Missing NEXT_PUBLIC_API_URL production variable'; exit 1; }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || { echo 'Missing NEXT_PUBLIC_TURNSTILE_SITE_KEY production variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN production secret'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID production secret'; exit 1; }
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install locked dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build the production Worker
        run: pnpm --dir web build:worker
      - name: Deploy the verified Worker bundle
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
