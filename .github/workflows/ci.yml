name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Python 3.12 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install locked dependencies
        run: uv sync --project api --locked
      - name: Wait for local Qdrant
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:6333/readyz
      - name: Lint, type check, test, and inspect tracked files
        run: make check
