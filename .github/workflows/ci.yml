name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Python 3.12 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: met_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d met_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/met_agent_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install locked dependencies
        run: uv sync --project api --locked
      - name: Wait for local Qdrant
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:6333/readyz
      - name: Lint, type check, test, and inspect tracked files
        run: make check

  web:
    name: Node 20 web and Workers checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5
      - name: Install locked dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Lint, type check, test, and build the Worker
        run: make web-check

  containers:
    name: Production container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the Compose application
        run: docker compose config --quiet
      - name: Build the API and local web images
        run: docker compose build api web

  evals:
    name: Live golden regression gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: evaluations
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LLM_MODEL: groq/openai/gpt-oss-120b
      LLM_MODEL_LITE: groq/openai/gpt-oss-20b
      LLM_FALLBACK_ENABLED: 'false'
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: intfloat/multilingual-e5-large
      EMBEDDING_DIMENSIONS: '1024'
      USE_AI_GATEWAY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Read the reviewed baseline from the target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-reference
          sparse-checkout: evals/reports/baseline.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require evaluation credentials and baseline
        run: |
          test -n "$GROQ_API_KEY" || { echo 'Missing GROQ_API_KEY evaluation secret'; exit 1; }
          test -n "$QDRANT_URL" || { echo 'Missing QDRANT_URL evaluation secret'; exit 1; }
          test -n "$QDRANT_API_KEY" || { echo 'Missing read-only QDRANT_API_KEY evaluation secret'; exit 1; }
          test -f baseline-reference/evals/reports/baseline.json
      - name: Install locked dependencies
        run: uv sync --project api --locked
      - name: Compare ten golden questions with the reviewed baseline
        run: make evals-quick ARGS="--chat-deadline-seconds 300 --baseline baseline-reference/evals/reports/baseline.json --output-dir data/eval-ci"
      - name: Print measured report to the job summary
        if: always()
        run: |
          for report in data/eval-ci/*-quick.md; do
            test -f "$report" && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
