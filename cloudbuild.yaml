steps:
  - id: Verify-CI-Gate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "Validating GitHub CI gate for commit ${COMMIT_SHA}..."
        CHECKS_API="https://api.github.com/repos/AjayKasu1/met-collection-agent/commits/${COMMIT_SHA}/check-runs"
        START_TIME=$$(date +%s)
        TIMEOUT=600

        while true; do
          RESPONSE=$$(curl -sSL -H "Accept: application/vnd.github+json" "$${CHECKS_API}")
          PYTHON_OK=$$(echo "$${RESPONSE}" | grep -A 10 '"name": "Python 3.12 quality checks"' | grep '"conclusion": "success"' || true)
          CONTAINER_OK=$$(echo "$${RESPONSE}" | grep -A 10 '"name": "Production container builds"' | grep '"conclusion": "success"' || true)
          PYTHON_FAIL=$$(echo "$${RESPONSE}" | grep -A 10 '"name": "Python 3.12 quality checks"' | grep -E '"conclusion": "(failure|cancelled|timed_out)"' || true)
          CONTAINER_FAIL=$$(echo "$${RESPONSE}" | grep -A 10 '"name": "Production container builds"' | grep -E '"conclusion": "(failure|cancelled|timed_out)"' || true)

          if [ -n "$${PYTHON_FAIL}" ] || [ -n "$${CONTAINER_FAIL}" ]; then
            echo "Deployment blocked: GitHub CI failed for commit ${COMMIT_SHA}."
            exit 1
          fi

          if [ -n "$${PYTHON_OK}" ] && [ -n "$${CONTAINER_OK}" ]; then
            echo "Verified: Required GitHub CI checks passed with success for ${COMMIT_SHA}."
            break
          fi

          CURRENT_TIME=$$(date +%s)
          ELAPSED=$$((CURRENT_TIME - START_TIME))
          if [ $$ELAPSED -ge $$TIMEOUT ]; then
            echo "Deployment blocked: Timed out waiting for GitHub CI to pass for commit ${COMMIT_SHA}."
            exit 1
          fi

          echo "Waiting for GitHub CI completion ($${ELAPSED}s elapsed)..."
          sleep 15
        done

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --tag
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --file
      - api/Dockerfile
      - api

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --region=${_DEPLOY_REGION}
      - --image=${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID},gcb-trigger-id=${_TRIGGER_ID}
      - --update-env-vars=GIT_SHA=${COMMIT_SHA}
      - --cpu=4
      - --memory=8Gi
      - --concurrency=4
      - --min-instances=1
      - --cpu-boost
      - --quiet

images:
  - ${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/${REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

substitutions:
  _AR_HOSTNAME: us-east1-docker.pkg.dev
  _AR_PROJECT_ID: project-24b6075c-252b-4cbe-a6e
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-east1
  _SERVICE_NAME: met-collection-agent-api
  _TRIGGER_ID: 56151b74-fa80-412e-9d9c-89fac0263bda

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - met-collection-agent-api
